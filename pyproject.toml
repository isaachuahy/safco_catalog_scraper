[build-system]
requires = ["setuptools==84.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safco-catalog-scraper"
version = "0.1.0"
description = "Safco catalog extraction with resumable collection and bounded recovery."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.15.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["safco_catalog_scraper*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)s %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S"
